# =============================================================================
# ShrinkLink — Ingress (AWS ALB via Load Balancer Controller)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shrinklink-ingress
  namespace: shrinklink
  labels:
    app.kubernetes.io/part-of: shrinklink
  annotations:
    # ── AWS Load Balancer Controller ──────────────────────────────────────
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # Health-check defaults (applies to all target groups)
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          # ── API routes (Prefix match, longest path wins) ────────────────
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8001
          - path: /api/analytics
            pathType: Prefix
            backend:
              service:
                name: analytics-service
                port:
                  number: 8003
          - path: /api/urls
            pathType: Prefix
            backend:
              service:
                name: url-service
                port:
                  number: 8002
          # ── Catch-all: Frontend ─────────────────────────────────────────
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
