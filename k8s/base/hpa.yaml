# =============================================================================
# ShrinkLink — HorizontalPodAutoscaler (URL Service)
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: url-service-hpa
  namespace: shrinklink
  labels:
    app: shrinklink-url
    app.kubernetes.io/part-of: shrinklink
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: url-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    # ── Aggressive scale-up: react fast to traffic spikes ────────────────
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - type: Percent
          value: 100          # double current replica count per period
          periodSeconds: 30
        - type: Pods
          value: 4            # or add up to 4 pods per period
          periodSeconds: 30
      selectPolicy: Max       # pick whichever policy adds more replicas
    # ── Gradual scale-down: avoid flapping under bursty load ─────────────
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25           # remove at most 25 % of replicas per period
          periodSeconds: 60
      selectPolicy: Max
