apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shrinklink
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shrinklink-frontend
  template:
    metadata:
      labels:
        app: shrinklink-frontend
    spec:
      containers:
        - name: frontend
          image: 121728644131.dkr.ecr.us-east-1.amazonaws.com/shrinklink-frontend:v1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: shrinklink
spec:
  selector:
    app: shrinklink-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80