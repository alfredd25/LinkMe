# =============================================================================
# ShrinkLink — Auth Service (ClusterIP)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: shrinklink
  labels:
    app: shrinklink-auth
    app.kubernetes.io/part-of: shrinklink
spec:
  type: ClusterIP
  selector:
    app: shrinklink-auth
  ports:
    - name: http
      port: 8001
      targetPort: 8001
      protocol: TCP
