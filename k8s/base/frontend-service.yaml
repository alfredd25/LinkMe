# =============================================================================
# ShrinkLink — Frontend Service (ClusterIP)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: shrinklink
  labels:
    app: shrinklink-frontend
    app.kubernetes.io/part-of: shrinklink
spec:
  type: ClusterIP
  selector:
    app: shrinklink-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
