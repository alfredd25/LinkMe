apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: shrinklink
  labels:
    app: shrinklink-auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shrinklink-auth
  template:
    metadata:
      labels:
        app: shrinklink-auth
    spec:
      containers:
        - name: auth-service
          image: 121728644131.dkr.ecr.us-east-1.amazonaws.com/shrinklink-auth:v1.0.3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: shrinklink-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: shrinklink-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: shrinklink-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shrinklink-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shrinklink-secrets
                  key: DB_PASSWORD
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: shrinklink-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: shrinklink-config
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shrinklink-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shrinklink-secrets
                  key: JWT_SECRET
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: shrinklink-config
                  key: LOG_LEVEL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi  # Increased from 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 30  # Increased
            periodSeconds: 20
            timeoutSeconds: 10       # Increased
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 15  # Increased
            periodSeconds: 10
            timeoutSeconds: 5        # Increased
            failureThreshold: 3