# =============================================================================
# ShrinkLink — Secrets (base64-encoded templates)
# =============================================================================
# IMPORTANT: Replace the base64 values below with your actual credentials.
#   echo -n 'your-value' | base64
# In production, prefer AWS Secrets Manager + ExternalSecrets Operator.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: shrinklink-secrets
  namespace: shrinklink
  labels:
    app.kubernetes.io/part-of: shrinklink
type: Opaque
data:
  # echo -n 'shrinklink_admin' | base64 → c2hyaW5rbGlua19hZG1pbg==
  DB_USER: c2hyaW5rbGlua19hZG1pbg==
  # echo -n 'CHANGE_ME_DB_PASSWORD' | base64 → Q0hBTkdFX01FX0RCX1BBU1NXT1JE
  DB_PASSWORD: Q0hBTkdFX01FX0RCX1BBU1NXT1JE
  # echo -n 'CHANGE_ME_REDIS_PASSWORD' | base64 → Q0hBTkdFX01FX1JFRElTX1BBU1NXT1JE
  REDIS_PASSWORD: Q0hBTkdFX01FX1JFRElTX1BBU1NXT1JE
  # echo -n 'CHANGE_ME_JWT_SECRET' | base64 → Q0hBTkdFX01FX0pXVF9TRUNSRVQ=
  JWT_SECRET: Q0hBTkdFX01FX0pXVF9TRUNSRVQ=
